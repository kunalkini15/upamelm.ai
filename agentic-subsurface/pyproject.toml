[project]
name = "agentic-subsurface"
version = "0.1.0"
description = "Generic evidence-first, agentic subsurface research pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.28",
  "pymupdf>=1.24",
  "openpyxl>=3.1",
  "pillow>=10",
  "psutil>=5.9",
]

[project.scripts]
agentic-subsurface = "agentic_subsurface.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_subsurface"]

[tool.pytest.ini_options]
testpaths = ["tests"]

