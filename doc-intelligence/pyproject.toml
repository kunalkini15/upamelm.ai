[project]
name = "doc-intelligence"
version = "0.1.0"
description = "Generic, domain-agnostic Document Intelligence Engine for parsing, indexing, and task-driven structured extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "docling>=2.144.0",
    "httpx>=0.28.1",
    "llama-parse>=0.6.94",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "pytest-asyncio>=1.4.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
doc-intel = "doc_intelligence.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_intelligence"]
