[project]
name = "subsurface-research-engine-v2"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "python-dotenv", "httpx"]

[project.scripts]
research-engine-v2 = "research_engine_v2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_engine_v2"]
