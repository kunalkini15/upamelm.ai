[project]
name = "subsurface-research-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "python-dotenv", "httpx"]
[project.scripts]
research-engine = "research_engine.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["research_engine"]
