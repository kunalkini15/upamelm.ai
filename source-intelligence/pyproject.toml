[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "source-intelligence"
version = "0.1.0"
description = "Standalone, auditable city document sourcing and ingestion pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pypdf>=5,<7",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
source-intelligence = "source_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/source_intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

